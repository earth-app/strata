strata.settings.storage:
  path: '/admin/config/system/strata/storage'
  defaults:
    _form: Drupal\strata\Form\StorageSettingsForm
    _title: 'Strata Storage'
  requirements:
    _permission: 'manage strata storage+administer strata'
  options:
    _admin_route: TRUE

strata.settings.capture:
  path: '/admin/config/system/strata/capture'
  defaults:
    _form: Drupal\strata\Form\CaptureSettingsForm
    _title: 'Strata Capture'
  requirements:
    _permission: 'administer strata'
  options:
    _admin_route: TRUE

