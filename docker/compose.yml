services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: strata
      MINIO_ROOT_PASSWORD: stratatest
      MINIO_BROWSER_REDIRECT: 'off'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 2s
      timeout: 2s
      retries: 40
    ports:
      - '127.0.0.1:9000:9000' # s3 api
      - '127.0.0.1:9001:9001' # web console
    volumes:
      - minio-data:/data

  # creates the buckets and exits; started with `compose run --rm`, since `up --wait` reports a
  # container that exited as a failure even when it exited zero
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        mc alias set local http://minio:9000 strata stratatest
        mc mb --ignore-existing local/strata-backups
        mc mb --ignore-existing local/strata-replica
        mc anonymous set none local/strata-backups
        echo strata-minio-ready
    restart: 'no'

  # azure blob emulator. the account name and key are azurite's published well-known pair, so they
  # are not a secret; the container itself is created by `./startup.sh --provider=azure`
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0@sha256:647c63a91102a9d8e8000aab803436e1fc85fbb285e7ce830a82ee5d6661cf37
    command: ['azurite-blob', '--blobHost', '0.0.0.0', '--skipApiVersionCheck']
    healthcheck:
      test: ['CMD', 'nc', '-z', '127.0.0.1', '10000']
      interval: 2s
      timeout: 2s
      retries: 40
    ports:
      - '127.0.0.1:10000:10000' # blob service
    volumes:
      - azurite-data:/data

  # google cloud storage emulator, json api only, which is the api strata_gcs speaks
  gcs:
    image: fsouza/fake-gcs-server:1.52.2@sha256:d47b4cf8b87006cab8fbbecfa5f06a2a3c5722e464abddc0d107729663d40ec4
    command:
      - -scheme
      - http
      - -host
      - 0.0.0.0
      - -port
      - '4443'
      - -public-host
      - host.docker.internal:4443
    healthcheck:
      test: ['CMD', 'nc', '-z', '127.0.0.1', '4443']
      interval: 2s
      timeout: 2s
      retries: 40
    ports:
      - '127.0.0.1:4443:4443' # json api
    volumes:
      - gcs-data:/storage

  # the physical restore strategies are driver-specific, so the kernel suite has to run on each
  # engine rather than only on the sqlite the phpunit config defaults to. ports are shifted off the
  # defaults so a locally installed server or a ddev project keeps working alongside these
  mariadb:
    image: mariadb:11.8.3@sha256:ae6119716edac6998ae85508431b3d2e666530ddf4e94c61a10710caec9b0f71
    environment:
      MARIADB_ROOT_PASSWORD: strata
      MARIADB_DATABASE: strata
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 2s
      timeout: 2s
      retries: 40
    ports:
      - '127.0.0.1:13306:3306'
    volumes:
      - mariadb-data:/var/lib/mysql

  postgres:
    image: postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
    environment:
      POSTGRES_PASSWORD: strata
      POSTGRES_DB: strata
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres']
      interval: 2s
      timeout: 2s
      retries: 40
    ports:
      - '127.0.0.1:15432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  minio-data:
  azurite-data:
  gcs-data:
  mariadb-data:
  postgres-data:
