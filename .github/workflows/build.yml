name: Build Package

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Lint (PHP 8.3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sodium, zlib, zstd, json
          coverage: none
          tools: composer:v2

      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-8.3-${{ hashFiles('composer.json') }}
          restore-keys: composer-8.3-

      - name: Install Composer Dependencies
        run: |
          for attempt in 1 2 3; do
            composer install --prefer-dist --no-progress --no-interaction && exit 0
            echo "composer install failed; the phpdocumentor phar download is the usual cause"
            sleep 15
          done
          exit 1

      - run: php tests/drupal-root.php

      - run: ./vendor/bin/phpcs

      - run: ./vendor/bin/phpstan analyse --memory-limit=1G

  test:
    name: Engine Suite (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sodium, zlib, zstd, brotli, redis, json, pdo_sqlite
          coverage: none
          tools: composer:v2

      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install Composer Dependencies
        run: |
          for attempt in 1 2 3; do
            composer install --prefer-dist --no-progress --no-interaction && exit 0
            echo "composer install failed; the phpdocumentor phar download is the usual cause"
            sleep 15
          done
          exit 1

      - run: ./vendor/bin/phpunit --testsuite Unit

      - run: ./vendor/bin/paratest --testsuite Kernel --functional --max-batch-size 20

  functional:
    name: Browser Suite (PHP 8.3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sodium, zlib, zstd, brotli, json, pdo_sqlite, dom, gd
          coverage: none
          tools: composer:v2

      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-8.3-${{ hashFiles('composer.json') }}
          restore-keys: composer-8.3-

      - name: Install Composer Dependencies
        run: |
          for attempt in 1 2 3; do
            composer install --prefer-dist --no-progress --no-interaction && exit 0
            echo "composer install failed; the phpdocumentor phar download is the usual cause"
            sleep 15
          done
          exit 1

      - run: php tests/drupal-root.php

      - name: Serve the synthesised root
        run: |
          php -S localhost:8087 -t "$PWD/vendor/drupal" "$PWD/vendor/drupal/.ht.router.php" \
            > /tmp/strata-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:8087/core/install.php; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/strata-server.log
          exit 1

      - name: Functional suite
        env:
          SIMPLETEST_BASE_URL: http://localhost:8087
          SIMPLETEST_DB: sqlite://localhost/sites/default/files/.ht.functional.sqlite
          BROWSERTEST_OUTPUT_DIRECTORY: /tmp/strata-browser
        run: |
          mkdir -p /tmp/strata-browser
          ./vendor/bin/phpunit --testsuite Functional

      - if: failure()
        run: cat /tmp/strata-server.log

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-output
          path: /tmp/strata-browser
          if-no-files-found: ignore

  restore:
    name: Restore Strategies (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, mysql, pgsql]
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: strata
          MARIADB_DATABASE: strata
        ports: ['3306:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: strata
          POSTGRES_DB: strata
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sodium, zlib, zstd, brotli, json, pdo_sqlite, pdo_mysql, pdo_pgsql
          coverage: none
          tools: composer:v2

      - name: Start MinIO
        run: |
          docker run -d --name strata-minio -p 9000:9000 \
            -e MINIO_ROOT_USER=strata -e MINIO_ROOT_PASSWORD=stratatest \
            minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e \
            server /data
          for attempt in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:9000/minio/health/live; then
              docker exec strata-minio mc alias set local http://127.0.0.1:9000 strata stratatest
              docker exec strata-minio mc mb --ignore-existing local/strata-backups
              docker exec strata-minio mc mb --ignore-existing local/strata-replica
              exit 0
            fi
            sleep 1
          done
          docker logs strata-minio
          exit 1

      - name: Install Composer Dependencies
        run: |
          for attempt in 1 2 3; do
            composer install --prefer-dist --no-progress --no-interaction && exit 0
            echo "composer install failed; the phpdocumentor phar download is the usual cause"
            sleep 15
          done
          exit 1

      - name: Kernel suite
        env:
          SIMPLETEST_DB: ${{ matrix.db == 'sqlite' && 'sqlite://localhost/:memory:' || matrix.db == 'mysql' && 'mysql://root:strata@127.0.0.1:3306/strata' || 'pgsql://postgres:strata@127.0.0.1:5432/strata' }}
          STRATA_S3_ENDPOINT: http://127.0.0.1:9000
          STRATA_S3_KEY: strata
          STRATA_S3_SECRET: stratatest
        run: ./vendor/bin/paratest --testsuite Kernel --functional --max-batch-size 20
