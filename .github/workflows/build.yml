name: Build

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sodium, zlib, zstd, json
          coverage: none
          tools: composer:v2

      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-8.3-${{ hashFiles('composer.json') }}
          restore-keys: composer-8.3-

      - run: composer install --prefer-dist --no-progress --no-interaction

      - run: ./vendor/bin/phpcs

      - run: ./vendor/bin/phpstan analyse --memory-limit=1G

  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sodium, zlib, zstd, brotli, redis, json, pdo_sqlite
          coverage: none
          tools: composer:v2

      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-

      - run: composer install --prefer-dist --no-progress --no-interaction

      - run: ./vendor/bin/phpunit --testsuite Unit

      - run: ./vendor/bin/phpunit --testsuite Kernel

  functional:
    name: Browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sodium, zlib, zstd, brotli, json, pdo_sqlite, dom, gd
          coverage: none
          tools: composer:v2

      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-8.3-${{ hashFiles('composer.json') }}
          restore-keys: composer-8.3-

      - run: composer install --prefer-dist --no-progress --no-interaction

      - run: php tests/drupal-root.php

      - name: Serve the synthesised root
        run: |
          php -S localhost:8087 -t "$PWD/vendor/drupal" "$PWD/vendor/drupal/.ht.router.php" \
            > /tmp/strata-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:8087/core/install.php; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/strata-server.log
          exit 1

      - name: Functional suite
        env:
          SIMPLETEST_BASE_URL: http://localhost:8087
          SIMPLETEST_DB: sqlite://localhost/sites/default/files/.ht.functional.sqlite
          BROWSERTEST_OUTPUT_DIRECTORY: /tmp/strata-browser
        run: |
          mkdir -p /tmp/strata-browser
          ./vendor/bin/phpunit --testsuite Functional

      - if: failure()
        run: cat /tmp/strata-server.log

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-output
          path: /tmp/strata-browser
          if-no-files-found: ignore

  restore:
    name: Restore Strategies on ${{ matrix.db }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, mysql, pgsql]
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: strata
          MARIADB_DATABASE: strata
        ports: ['3306:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: strata
          POSTGRES_DB: strata
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      minio:
        image: bitnami/minio:latest
        env:
          MINIO_ROOT_USER: strata
          MINIO_ROOT_PASSWORD: stratatest
        ports: ['9000:9000']
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sodium, zlib, zstd, brotli, json, pdo_sqlite, pdo_mysql, pdo_pgsql
          coverage: none
          tools: composer:v2

      - run: composer install --prefer-dist --no-progress --no-interaction

      - name: Kernel suite
        env:
          SIMPLETEST_DB: ${{ matrix.db == 'sqlite' && 'sqlite://localhost/:memory:' || matrix.db == 'mysql' && 'mysql://root:strata@127.0.0.1:3306/strata' || 'pgsql://postgres:strata@127.0.0.1:5432/strata' }}
          STRATA_S3_ENDPOINT: http://127.0.0.1:9000
          STRATA_S3_KEY: strata
          STRATA_S3_SECRET: stratatest
        run: ./vendor/bin/phpunit --testsuite Kernel
