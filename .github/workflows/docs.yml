name: Publish Documentation

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  deploy:
    name: Deploy Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sodium, zlib, json
          coverage: none
          tools: composer:v2

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'

      - name: Install Composer Dependencies
        run: |
          for attempt in 1 2 3; do
            composer install --prefer-dist --no-progress --no-interaction && exit 0
            echo "composer install failed; the phpdocumentor phar download is the usual cause"
            sleep 15
          done
          exit 1

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build Documentation
        run: bun run docs

      - name: Deploy Documentation
        run: bash phpdoc.sh "${GITHUB_SHA::7}"
