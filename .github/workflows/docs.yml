name: Publish Documentation

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: docs
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sodium, zlib, json
          coverage: none
          tools: composer:v2

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Composer Dependencies
        run: |
          for attempt in 1 2 3; do
            composer install --prefer-dist --no-progress --no-interaction && exit 0
            echo "composer install failed; the phpdocumentor phar download is the usual cause"
            sleep 15
          done
          exit 1

      - run: bun install --frozen-lockfile

      - run: bun run docs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    name: Deploy Documentation
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
