name: Release Project

on:
  workflow_dispatch:
    inputs:
      changelog:
        type: string
        description: 'Changelog to replace the auto-generated one'
      suffix:
        type: string
        description: 'Suffix to append to the version'
        default: ''
  schedule:
    - cron: '40 4 * * *'

jobs:
  release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Extract Version from package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Extracted Version: $VERSION"
          if [ -z "$VERSION" ] || [ "$VERSION" = "undefined" ]; then
            echo "package.json has no version field; the tag would be 'vundefined'." >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Retrieve Latest Tag
        id: latest_tag
        run: |
          echo "LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo '')" >> "$GITHUB_ENV"
      - name: Generate Changelog
        if: ${{ github.event.inputs.changelog == '' }}
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          configuration: '.github/release.json'
          mode: 'HYBRID'
          fromTag: '${{ env.LATEST_TAG }}'
          toTag: '${{ github.ref_name }}'
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}${{ github.event.inputs.suffix }}
          name: 'earth-app/strata v${{ env.VERSION }}${{ github.event.inputs.suffix }}'
          body: |
            Commit: ${{ github.sha }}

            ${{ steps.changelog.outputs.changelog || github.event.inputs.changelog }}
          draft: false
          prerelease: ${{ github.ref_name != 'master' }}

  nightly-gate:
    if: github.event_name == 'schedule'
    name: Nightly Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    outputs:
      fresh: ${{ steps.fresh.outputs.fresh }}
      assertions: ${{ steps.suite.outputs.assertions }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check for Commits in the Last Day
        id: fresh
        run: |
          if [ -z "$(git log --since='24 hours ago' --format=%H)" ]; then
            echo "No commits in the last 24 hours; nothing to publish."
            echo "fresh=false" >> $GITHUB_OUTPUT
          else
            echo "fresh=true" >> $GITHUB_OUTPUT
          fi
      - name: Set up PHP
        if: steps.fresh.outputs.fresh == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sodium, zlib, zstd, brotli, json, mbstring, dom, xml, pdo_sqlite
          coverage: none
          tools: composer:v2
      - name: Install Composer Dependencies
        if: steps.fresh.outputs.fresh == 'true'
        run: composer install --no-interaction --no-progress
      - name: Check Coding Standards
        if: steps.fresh.outputs.fresh == 'true'
        run: ./vendor/bin/phpcs
      - name: Run PHPStan
        if: steps.fresh.outputs.fresh == 'true'
        run: ./vendor/bin/phpstan analyse --memory-limit=1G --no-progress
      - name: Run the Suites
        if: steps.fresh.outputs.fresh == 'true'
        id: suite
        run: |
          ./vendor/bin/phpunit --testsuite Unit | tee /tmp/unit.log
          ./vendor/bin/phpunit --testsuite Kernel | tee /tmp/kernel.log
          UNIT=$(grep -oE 'Assertions: [0-9]+' /tmp/unit.log | grep -oE '[0-9]+')
          KERNEL=$(grep -oE 'Assertions: [0-9]+' /tmp/kernel.log | grep -oE '[0-9]+')
          echo "assertions=$((UNIT + KERNEL))" >> $GITHUB_OUTPUT

  nightly-publish:
    if: ${{ github.event_name == 'schedule' && needs.nightly-gate.outputs.fresh == 'true' }}
    name: Nightly Publish
    runs-on: ubuntu-latest
    needs: nightly-gate

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
      - name: Build the Nightly Identity
        run: |
          SHORT=$(git rev-parse --short HEAD)
          echo "NIGHTLY_TAG=nightly-$(date -u +%Y%m%d)-${SHORT}" >> $GITHUB_ENV
          echo "SHORT_SHA=${SHORT}" >> $GITHUB_ENV
      - name: Create Nightly Prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.NIGHTLY_TAG }}
          name: 'nightly ${{ env.SHORT_SHA }}'
          body: |
            Unreleased build of `master`.

            - Commit: `${{ github.sha }}`
            - Suites: ${{ needs.nightly-gate.outputs.assertions }} assertions passed

            This tag is not a Composer version, so Packagist ignores it. To install this
            code, require `dev-master`, which now resolves to the commit above.
          draft: false
          prerelease: true
          make_latest: false
      - name: Nightly to Job Summary
        run: |
          echo "## Nightly ${{ env.SHORT_SHA }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Tag: \`${{ env.NIGHTLY_TAG }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Assertions: ${{ needs.nightly-gate.outputs.assertions }}" >> $GITHUB_STEP_SUMMARY
