name: Check Test Coverage

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Suite Coverage (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, functional]
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sodium, zlib, zstd, brotli, json, pdo_sqlite, dom, gd
          coverage: pcov
          ini-values: 'pcov.initial.files=25000,pcov.initial.memory=33554432'
          tools: composer:v2

      - uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: composer-coverage-${{ hashFiles('composer.json') }}
          restore-keys: composer-coverage-

      - name: Install Composer Dependencies
        run: |
          for attempt in 1 2 3; do
            composer install --prefer-dist --no-progress --no-interaction && exit 0
            echo "composer install failed; the phpdocumentor phar download is the usual cause"
            sleep 15
          done
          exit 1

      - if: matrix.suite == 'functional'
        run: php tests/drupal-root.php

      - name: Serve the synthesised root
        if: matrix.suite == 'functional'
        run: |
          php -S localhost:8087 -t "$PWD/vendor/drupal" "$PWD/vendor/drupal/.ht.router.php" \
            > /tmp/strata-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:8087/core/install.php; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/strata-server.log
          exit 1

      - run: bun run test:coverage:${{ matrix.suite }}
        shell: bash
        env:
          SIMPLETEST_BASE_URL: http://localhost:8087
          SIMPLETEST_DB: sqlite://localhost/sites/default/files/.ht.functional.sqlite

      - name: Upload Coverage to Codecov
        if: success() || failure()
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: earth-app/strata
          fail_ci_if_error: false
          report_type: coverage
          flags: ${{ matrix.suite }}
          files: coverage/${{ matrix.suite }}.clover.xml

      - name: Upload Test Results to Codecov
        if: success() || failure()
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: earth-app/strata
          fail_ci_if_error: false
          report_type: test_results
          flags: ${{ matrix.suite }}
          files: coverage/${{ matrix.suite }}.junit.xml

      - name: Archive Coverage
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.suite }}
          path: coverage/
          retention-days: 30
          if-no-files-found: error

      - name: Coverage to Job Summary
        if: success() || failure()
        run: |
          echo "## Suite Coverage (${{ matrix.suite }})" >> $GITHUB_STEP_SUMMARY
          if [ -f "coverage/${{ matrix.suite }}.coverage.txt" ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat "coverage/${{ matrix.suite }}.coverage.txt" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo 'No report was produced; the run refused to measure.' >> $GITHUB_STEP_SUMMARY
          fi

  kernel:
    name: Kernel Coverage (Shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sodium, zlib, zstd, brotli, json, pdo_sqlite, dom, gd
          coverage: pcov
          ini-values: 'pcov.initial.files=25000,pcov.initial.memory=33554432'
          tools: composer:v2

      - uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: composer-coverage-${{ hashFiles('composer.json') }}
          restore-keys: composer-coverage-

      - name: Install Composer Dependencies
        run: |
          for attempt in 1 2 3; do
            composer install --prefer-dist --no-progress --no-interaction && exit 0
            echo "composer install failed; the phpdocumentor phar download is the usual cause"
            sleep 15
          done
          exit 1

      - name: Plan Shard ${{ matrix.shard }}
        run: bun run test:shard -- --suite=Kernel --index=${{ matrix.shard }} --total=${{ strategy.job-total }}

      - run: bun run test:coverage:kernel:shard

      - name: Upload Coverage to Codecov
        if: success() || failure()
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: earth-app/strata
          fail_ci_if_error: false
          report_type: coverage
          flags: kernel
          files: coverage/kernel.clover.xml

      - name: Upload Test Results to Codecov
        if: success() || failure()
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: earth-app/strata
          fail_ci_if_error: false
          report_type: test_results
          flags: kernel
          files: coverage/kernel.junit.xml

      - name: Archive Coverage
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-kernel-shard-${{ matrix.shard }}
          path: coverage/
          retention-days: 30
          if-no-files-found: error
