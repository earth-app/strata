'administer strata':
  title: 'Administer Strata'
  description: 'Configure storage, capture scope, retention and encryption. Grants every other Strata permission by implication.'
  restrict access: true

'view strata timeline':
  title: 'View Strata Timeline'
  description: 'See when the site changed, what changed and who changed it.'

'view strata diffs':
  title: 'View Strata Diffs'
  description: 'See which fields, settings and rows changed between two points in time.'

'view strata payloads':
  title: 'View Strata Payloads'
  description: 'See the stored values themselves, which include any content the site holds.'
  restrict access: true

'view strata cost estimates':
  title: 'View Strata Cost Estimates'
  description: 'Use the estimator and see what stored history costs per month.'

'view strata health':
  title: 'View Strata Health'
  description: 'See open findings, their repair rungs and what the last drill proved.'

'create strata snapshot':
  title: 'Create a Strata Snapshot'
  description: 'Seal the current window on demand, rather than waiting for the flush interval.'

'rollback strata content':
  title: 'Roll Back Content'
  description: 'Restore entities to an earlier state.'
  restrict access: true

'rollback strata config':
  title: 'Roll Back Configuration'
  description: 'Restore configuration to an earlier state. Includes permissions and text formats, so this grants a path to further privilege.'
  restrict access: true

'rollback strata files':
  title: 'Roll Back Files'
  description: 'Restore managed and unmanaged files to an earlier state.'
  restrict access: true

'rollback strata database':
  title: 'Roll Back Database Tables'
  description: 'Replace whole table contents. Removes rows that were never captured.'
  restrict access: true

'rollback strata full site':
  title: 'Roll Back the Whole Site'
  description: 'Restore every realm at once, in maintenance mode.'
  restrict access: true

'branch strata config':
  title: 'Branch Strata Configuration'
  description: 'Fork a named branch off a commit and let configuration diverge on it. Writes nothing to the live site.'

'merge strata config':
  title: 'Merge Strata Configuration'
  description: 'Merge a configuration branch back into the trunk, which writes those objects to the live site.'
  restrict access: true

'repair strata':
  title: 'Repair Strata'
  description: 'Run the automatic repair rungs against an open finding.'
  restrict access: true

'quarantine strata':
  title: 'Quarantine Strata Commits'
  description: 'Mark a commit or segment unusable and remove it from the restore targets. The bytes are kept.'
  restrict access: true

'delete strata snapshots':
  title: 'Delete Strata Snapshots'
  description: 'Prune stored history. This destroys restore points permanently.'
  restrict access: true

'manage strata storage':
  title: 'Manage Strata Storage'
  description: 'Change the storage provider, its credentials and its bucket.'
  restrict access: true

permission_callbacks:
  - \Drupal\strata\Access\StrataPermissions::permissions
