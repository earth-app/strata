services:
  strata_files.capture:
    class: Drupal\strata\File\FileCapture
    factory: ['@strata.engine', 'fileCapture']

  Drupal\strata\File\FileCapture:
    alias: strata_files.capture

  Drupal\strata_files\Hook\ManagedFileCapture:
    class: Drupal\strata_files\Hook\ManagedFileCapture
    arguments:
      - '@strata.engine'
      - '@strata.capture_scope'
      - '@current_user'
      - '@file_system'
      - '@logger.channel.strata'
