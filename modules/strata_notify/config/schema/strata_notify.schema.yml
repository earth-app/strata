strata_notify.settings:
  type: config_object
  label: 'Strata notification settings'
  mapping:
    recipients:
      type: string
      label: 'Comma-separated addresses notified'
    severity:
      type: integer
      label: 'Lowest finding severity that is mailed'
    events:
      type: mapping
      label: 'Which events are notified'
      mapping:
        restore:
          type: boolean
          label: 'A restore finished'
        budget:
          type: boolean
          label: 'A budget ceiling was crossed'
        health:
          type: boolean
          label: 'A finding was recorded'
        drill:
          type: boolean
          label: 'A restore drill finished'
        prune:
          type: boolean
          label: 'A prune destroyed restore points'
        commit:
          type: boolean
          label: 'A flush sealed a window'
    digest:
      type: boolean
      label: 'Collapse repeats of one finding code into one mail per cron run'
