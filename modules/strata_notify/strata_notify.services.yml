services:
  strata_notify.policy:
    class: Drupal\strata_notify\NotificationPolicy
    arguments: ['@config.factory']

  Drupal\strata_notify\NotificationPolicy:
    alias: strata_notify.policy

  strata_notify.subscriber:
    class: Drupal\strata_notify\NotificationSubscriber
    arguments:
      - '@strata_notify.policy'
      - '@plugin.manager.mail'
      - '@language_manager'
      - '@logger.channel.strata'
    tags:
      - { name: event_subscriber }

  Drupal\strata_notify\Hook\Mail:
    class: Drupal\strata_notify\Hook\Mail
